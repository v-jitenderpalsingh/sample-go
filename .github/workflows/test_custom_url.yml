name: Test custom Go download

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go from custom URL
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: go1.27.3
          go-download-base-url: 'https://aka.ms/golang/release/latest'
          architecture: 'x64'
          cache: false

      - name: Verify installed version
        run: |
          go version
      
      - name: Again setup go to check cache lookup
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: go1.27.3
          go-download-base-url: 'https://aka.ms/golang/release/latest'
          architecture: 'x64'
          cache: false

      - name: Verify installed version again
        run: |
          go version