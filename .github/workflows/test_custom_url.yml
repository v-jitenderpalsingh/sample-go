name: Test custom Go download

on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go from custom URL
        uses: v-jitenderpalsingh/setup-go@04c4297c040ba26134953a13631204751be47cfb
        with:
          go-version: 'go1.25.14'
          go-download-base-url: 'https://dl.google.com/go'
          architecture: 'x64'
          cache: false

      - name: Verify installed version
        run: |
          go version
      
      - name: Again setup go to check cache lookup
        uses: v-jitenderpalsingh/setup-go@04c4297c040ba26134953a13631204751be47cfb
        with:
          go-version: 'go1.25.14'
          go-download-base-url: 'https://dl.google.com/go'
          architecture: 'x64'
          cache: false

      - name: Verify installed version again
        run: |
          go version