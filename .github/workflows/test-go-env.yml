name: Test go env workflow

on: [push, workflow_dispatch]

jobs:  
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, ubuntu-26.04-arm, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        id: setup-go
        with:
          go-version: 1.27
          cache: true
      - name: Run check commands
        run: |
          go version
          go env
          echo '******************************************************'
          echo 'go-version: ${{ steps.setup-go.outputs.go-version }}'
          echo 'cache-hit:  ${{ steps.setup-go.outputs.cache-hit }}'
          echo 'go-path:    ${{ steps.setup-go.outputs.go-path }}'
          echo 'go-bin:    ${{ steps.setup-go.outputs.go-bin }}'
          echo 'go-bin-path:    ${{ steps.setup-go.outputs.go-bin-path }}'
          echo 'go-root:    ${{ steps.setup-go.outputs.go-root }}'
          echo 'go-cache:    ${{ steps.setup-go.outputs.go-cache }}'
          echo 'go-mod-cache:    ${{ steps.setup-go.outputs.go-mod-cache }}'
          echo 'go-os:    ${{ steps.setup-go.outputs.go-os }}'
          echo 'go-arch:    ${{ steps.setup-go.outputs.go-arch }}'
          echo 'go-tool-dir:    ${{ steps.setup-go.outputs.go-tool-dir }}'
    
  test-old:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        id: setup-go-old
        with:
          go-version: 1.8
          cache: true
      - name: Run check commands
        run: |
          go version
          go env
          echo '******************************************************'
          echo 'go-version: ${{ steps.setup-go-old.outputs.go-version }}'
          echo 'cache-hit:  ${{ steps.setup-go-old.outputs.cache-hit }}'
          echo 'go-path:    ${{ steps.setup-go-old.outputs.go-path }}'
          echo 'go-bin:    ${{ steps.setup-go-old.outputs.go-bin }}'
          echo 'go-bin-path:    ${{ steps.setup-go-old.outputs.go-bin-path }}'
          echo 'go-root:    ${{ steps.setup-go-old.outputs.go-root }}'
          echo 'go-cache:    ${{ steps.setup-go-old.outputs.go-cache }}'
          echo 'go-mod-cache:    ${{ steps.setup-go-old.outputs.go-mod-cache }}'
          echo 'go-os:    ${{ steps.setup-go-old.outputs.go-os }}'
          echo 'go-arch:    ${{ steps.setup-go-old.outputs.go-arch }}'
          echo 'go-tool-dir:    ${{ steps.setup-go-old.outputs.go-tool-dir }}'
