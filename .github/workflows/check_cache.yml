name: Check cache

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@v7.1.0
        env:
          ImageOS: ubuntu24
        with:
          go-version-file: go.mod

      - name: Run go version
        run: |
          go version
          go mod download
          go run .
      - name: Test using restored build cache
        run: go test -count=1 ./...

      - name: Test using fresh build cache
        run: GOCACHE="$(mktemp -d)" go test -count=1 ./...