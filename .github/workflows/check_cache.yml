name: Check cache

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go version
        run: |
          go version
          go mod download
          go run .
          