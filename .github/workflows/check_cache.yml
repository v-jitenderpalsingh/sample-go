name: CGO cache experiment

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-go@main
        with:
          go-version: "1.25.0"
          cache: true

      - name: Display Go version
        run: go version

      - name: check runner variables
        run: |
          echo "ImageOS: $ImageOS"
          echo "IMAGE_OS: $IMAGE_OS"