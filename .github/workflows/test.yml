name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Check the go version on runner
        run: |
          which go