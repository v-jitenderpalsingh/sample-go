name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@main
        with:
          go-version: '~^v1.14.0'

      - name: Run go version
        run: go version


  test-pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        
      - name: Test setup go using PR
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version: '~^v1.14.0'

      - name: check go version
        run: go version
