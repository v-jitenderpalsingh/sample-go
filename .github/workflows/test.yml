name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: {{ matrix.os }}
    strategy: 
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Check go version
        run: go version
      
      - name: Run main
        run: |
          cat go.mod
          echo " *************** "
          go mod tidy
          echo " *************** "
          cat go.mod
          echo " *************** "
          go run main.go