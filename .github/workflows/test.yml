name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go 1.26
        id: setup-go
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: 1.26
          cache: true
      - name: Set up Go 1.26.1
        id: setup-go-1-26-1
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: 1.26.1
          cache: true
      - name: Set up Go stable
        id: setup-go-stable
        uses: v-mahabaleshwars/setup-go@feature/54-export-env-variables
        with:
          go-version: stable
          cache: true

      - name: Show setup-go outputs
        shell: bash
        run: |
          echo 'go-version: ${{ steps.setup-go.outputs.go-version }}'
          echo 'cache-hit:  ${{ steps.setup-go.outputs.cache-hit }}'
          echo 'go-path:    ${{ steps.setup-go.outputs.go-path }}'
          echo 'go-bin:    ${{ steps.setup-go.outputs.go-bin }}'
          echo 'go-bin-path:    ${{ steps.setup-go.outputs.go-bin-path }}'
          echo 'go-root:    ${{ steps.setup-go.outputs.go-root }}'
          echo 'go-cache:    ${{ steps.setup-go.outputs.go-cache }}'
          echo 'go-mod-cache:    ${{ steps.setup-go.outputs.go-mod-cache }}'
          echo 'go-os:    ${{ steps.setup-go.outputs.go-os }}'
          echo 'go-arch:    ${{ steps.setup-go.outputs.go-arch }}'
          echo 'go-tool-dir:    ${{ steps.setup-go.outputs.go-tool-dir }}'

      - name: Show setup-go-1-26-1 outputs
        shell: bash
        run: |
          echo 'go-version: ${{ steps.setup-go-1-26-1.outputs.go-version }}'
          echo 'cache-hit:  ${{ steps.setup-go-1-26-1.outputs.cache-hit }}'
          echo 'go-path:    ${{ steps.setup-go-1-26-1.outputs.go-path }}'
          echo 'go-bin:    ${{ steps.setup-go-1-26-1.outputs.go-bin }}'
          echo 'go-bin-path:    ${{ steps.setup-go-1-26-1.outputs.go-bin-path }}'
          echo 'go-root:    ${{ steps.setup-go-1-26-1.outputs.go-root }}'
          echo 'go-cache:    ${{ steps.setup-go-1-26-1.outputs.go-cache }}'
          echo 'go-mod-cache:    ${{ steps.setup-go-1-26-1.outputs.go-mod-cache }}'
          echo 'go-os:    ${{ steps.setup-go-1-26-1.outputs.go-os }}'
          echo 'go-arch:    ${{ steps.setup-go-1-26-1.outputs.go-arch }}'
          echo 'go-tool-dir:    ${{ steps.setup-go-1-26-1.outputs.go-tool-dir }}'

      - name: Show setup-go-stable
        shell: bash
        run: |
          echo 'go-version: ${{ steps.setup-go-stable.outputs.go-version }}'
          echo 'cache-hit:  ${{ steps.setup-go-stable.outputs.cache-hit }}'
          echo 'go-path:    ${{ steps.setup-go-stable.outputs.go-path }}'
          echo 'go-bin:    ${{ steps.setup-go-stable.outputs.go-bin }}'
          echo 'go-bin-path:    ${{ steps.setup-go-stable.outputs.go-bin-path }}'
          echo 'go-root:    ${{ steps.setup-go-stable.outputs.go-root }}'
          echo 'go-cache:    ${{ steps.setup-go-stable.outputs.go-cache }}'
          echo 'go-mod-cache:    ${{ steps.setup-go-stable.outputs.go-mod-cache }}'
          echo 'go-os:    ${{ steps.setup-go-stable.outputs.go-os }}'
          echo 'go-arch:    ${{ steps.setup-go-stable.outputs.go-arch }}'
          echo 'go-tool-dir:    ${{ steps.setup-go-stable.outputs.go-tool-dir }}'
    
      - name: Run main
        run: |
          go version
          go run main.go