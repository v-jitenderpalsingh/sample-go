name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@main
        with:
          go-version: 1.27.0-rc.1

      - name: Run go version
        run: go version

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: arnested/setup-go@rc
        with:
          go-version: 1.27.0-rc.1

      - name: Run go version
        run: go version