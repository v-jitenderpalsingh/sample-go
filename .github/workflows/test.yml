name: Test workflow

on: [workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-slim]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod

      - name: Run go version
        run: |
          go version
          go mod download
          go run .