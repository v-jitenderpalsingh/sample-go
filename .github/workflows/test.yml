name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: arnested/setup-go@rc

      - name: setup go
        uses: actions/setup-go@main
        with:
          go-version-file: go.mod

      - name: Run go version
        run: go version

      - name: Again setup go
        uses: arnested/setup-go@rc
        with:
          go-version-file: go.mod
      
      - name: Test version
        run: go version