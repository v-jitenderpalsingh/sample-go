name: Test workflow

on: [push, workflow_dispatch]

jobs:
  test-v6:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      
      - name: Check version
        run: go version

  test-esm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-go@v6
        with:
          go-version: 1.26
      
      - name: Check version
        run: go version