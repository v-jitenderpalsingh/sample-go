name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-pr:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: setup go
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version-file: version-file.txt

      - name: Run go version
        run: |
          go version

      - name: Again setup go
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version-file: version-file.txt

      - name: Test version again
        run: |
          go version
