name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-15-intel, macos-latest, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7

      - run: |
          go version
