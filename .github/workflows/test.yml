name: Test workflow

on: [push, workflow_dispatch]

jobs:  
  test-v7:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26

      - name: Check go version
        run: go version
      
      - name: Run main
        run: go run main.go