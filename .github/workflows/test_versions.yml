name: Test Go version syntax

on: [push, workflow_dispatch]

jobs:
  # --- 1. Valid inputs that must succeed and resolve to the expected Go version ---
  valid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        go: ['1.21',  '^1.22', '~1.22.0', '1.22.0-rc.1', '1.19.0-beta.1', 'go1.21', 'go1.21.5', 'go1.19beta1', 'go1.22rc1']

    steps:
      - uses: actions/checkout@v7
      - name: setup-go (${{ matrix.go-version }})
        id: setup
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: ${{ matrix.go }}
      - name: Verify installed version
        run: |
          installed="$(go version)"
          echo "Installed: $installed"
          echo "Output:    ${{ steps.setup.outputs.go-version }}"

  # --- 2. Invalid Go-native inputs that must FAIL with the error message ---
  invalid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bad-version: ['go1.21.x', 'go^1.21', 'go~1.21', 'go1.21-rc.1', 'gotip', "go1"]

    steps:
      - uses: actions/checkout@v7
      - name: setup-go must fail for ${{ matrix.bad-version }}
        uses: v-jitenderpalsingh/setup-go@test-go-version-new
        with:
          go-version: ${{ matrix.bad-version }}
      - name: Assert previous step failed
        run: |
          go version
