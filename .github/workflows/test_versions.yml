name: Test Go version syntax

on: [push, workflow_dispatch]

jobs:
  # --- 1. Valid inputs that must succeed and resolve to the expected Go version ---
  valid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        go: ['1.21',  '^1.22', '~1.22.0', '1.22.0-rc.1', '1.23.0-beta.1', 'go1.21', 'go1.21.5', 'go1.22beta1', 'go1.22rc1']

    steps:
      - uses: actions/checkout@v7
      - name: setup-go (${{ matrix.go-version }})
        id: setup
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version: ${{ matrix.go }}
      - name: Verify installed version
        run: |
          installed="$(go version)"
          echo "Installed: $installed"
          echo "Output:    ${{ steps.setup.outputs.go-version }}"

  # --- 2. go-version-file (.go-version with Go-native string) ---
  version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "go1.21.5" > .go-version
      - uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version-file: .go-version
      - run: go version | grep -F 'go1.21.5'

  # --- 3. Invalid Go-native inputs that must FAIL with the new error message ---
  invalid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bad-version: ['go1.21.x', 'go^1.21', 'go~1.21', 'go1.21-rc.1', 'gotip']

    steps:
      - uses: actions/checkout@v7
      - name: setup-go must fail for ${{ matrix.bad-version }}
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version: ${{ matrix.bad-version }}
      - name: Assert previous step failed
        run: |
          go version

  # --- 4. Invalid Go-native value inside .go-version file must also fail ---
  invalid-version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "go1.21.x" > .go-version
      - uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version-file: .go-version
      - run: |
          go version