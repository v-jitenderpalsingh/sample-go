name: Test different versions of Go
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}

      - name: Run Go
        run: |
          echo "Testing with Go version ${{ matrix.go }}"
          echo "Go version: $(go version)"
          go run main.go