name: Test Go version syntax

on: [push, workflow_dispatch]

jobs:
  # --- 1. Valid inputs that must succeed and resolve to the expected Go version ---
  valid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # semver inputs (unchanged behavior)
          - go-version: '1.21'
            expect-contains: 'go1.21'
          - go-version: '1.21.5'
            expect-contains: 'go1.21.5'
          - go-version: '^1.22'
            expect-contains: 'go1.22'
          - go-version: '~1.22.0'
            expect-contains: 'go1.22'
          - go-version: '1.22.0-rc.1'
            expect-contains: 'go1.22rc1'

          # Go-native inputs (new behavior)
          - go-version: 'go1.21'
            expect-contains: 'go1.21 '          # exact go1.21, trailing space rules out go1.21.5
          - go-version: 'go1.21.5'
            expect-contains: 'go1.21.5'
          - go-version: 'go1.22beta1'
            expect-contains: 'go1.22beta1'
          - go-version: 'go1.22rc1'
            expect-contains: 'go1.22rc1'

    steps:
      - uses: actions/checkout@v4
      - name: setup-go (${{ matrix.go-version }})
        id: setup
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version: ${{ matrix.go-version }}
      - name: Verify installed version
        run: |
          installed="$(go version)"
          echo "Installed: $installed"
          echo "Output:    ${{ steps.setup.outputs.go-version }}"
          echo "$installed" | grep -F -- "${{ matrix.expect-contains }}"

  # --- 2. go-version-file (.go-version with Go-native string) ---
  version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "go1.21.5" > .go-version
      - uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version-file: .go-version
      - run: go version | grep -F 'go1.21.5'

  # --- 3. Invalid Go-native inputs that must FAIL with the new error message ---
  invalid-inputs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bad-version:
          - 'go1.21.x'      # silently coerced before; now rejected
          - 'go^1.21'       # semver range with go prefix
          - 'go~1.21'
          - 'go1.21-rc.1'   # wrong separator (upstream uses 'rc1' not '-rc.1')
          - 'gotip'
    steps:
      - uses: actions/checkout@v4
      - name: setup-go must fail for ${{ matrix.bad-version }}
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version: ${{ matrix.bad-version }}
      - name: Assert previous step failed
        run: |
          go version

  # --- 4. Invalid Go-native value inside .go-version file must also fail ---
  invalid-version-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "go1.21.x" > .go-version
      - id: setup
        continue-on-error: true
        uses: v-jitenderpalsingh/setup-go@test-go-version
        with:
          go-version-file: .go-version
      - run: |
          go version